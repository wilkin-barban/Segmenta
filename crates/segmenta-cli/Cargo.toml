[package]
name = "segmenta-cli"
description = "Segmenta command line control for the download daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "segmenta_cli"
path = "src/lib.rs"

[[bin]]
name = "segmenta-cli"
path = "src/main.rs"

[[bin]]
name = "segmenta"
path = "src/bin/segmenta.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
segmenta-daemon = { path = "../segmenta-daemon" }
segmenta-i18n.workspace = true

[dev-dependencies]
hex.workspace = true
segmenta-core = { path = "../segmenta-core", features = ["testserver"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
