[package]
name = "segmenta-daemon"
description = "Segmenta download daemon: SQLite state, JSON-RPC IPC and task orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "segmenta_daemon"
path = "src/lib.rs"

[[bin]]
name = "segmenta-daemon"
path = "src/main.rs"

[dependencies]
clap.workspace = true
futures-util.workspace = true
hex.workspace = true
libc.workspace = true
rand.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
segmenta-core = { path = "../segmenta-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
url = "2"
librqbit = "9.1"
librqbit-bencode = "9.1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }


[dev-dependencies]
tempfile.workspace = true
segmenta-core = { path = "../segmenta-core", features = ["testserver"] }
