[package]
name = "segmenta-gui"
description = "Fast segmented download manager (daemon, CLI and GTK4 client)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage = "https://github.com/wilkin-barban/Segmenta"

[lib]
name = "segmenta_gui"
path = "src/lib.rs"

[[bin]]
name = "segmenta-gui"
path = "src/main.rs"

[dependencies]
glib = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
segmenta-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

# cargo-deb packaging of the GUI crate: the three binaries, the systemd user
# units, the desktop entry, the icon and the AppStream metadata ship in one
# `segmenta` package (S20). Sources live outside this crate, so they are
# addressed relative to this manifest.
[package.metadata.deb]
name = "segmenta"
section = "net"
priority = "optional"
maintainer = "Wilkin Barban Rosabal <barbanwilkin@gmail.com>"
copyright = "2026, Wilkin Barban Rosabal"
license-file = ["../../LICENSE", "0"]
extended-description = "Segmenta downloads HTTP and HTTPS files with several connections at once, writes every byte at its final offset and keeps the segment table in SQLite so a download survives a pause, a crash or a reboot. This package installs the download daemon (systemd user units), the segmenta CLI and the GTK4/Libadwaita desktop client."
depends = "$auto, libgtk-4-1, libadwaita-1-0, libsecret-tools, ffmpeg, yt-dlp"
assets = [
    ["../../target/release/segmenta-gui", "usr/bin/", "755"],
    ["../../target/release/segmenta-cli", "usr/bin/", "755"],
    ["../../target/release/segmenta", "usr/bin/", "755"],
    ["../../target/release/segmenta-daemon", "usr/bin/", "755"],
    ["../../target/release/segmenta-host", "usr/bin/", "755"],
    ["../../packaging/native-messaging/google-chrome.json", "etc/opt/chrome/native-messaging-hosts/io.github.wilkin.segmenta.json", "644"],
    ["../../packaging/native-messaging/chromium.json", "etc/chromium/native-messaging-hosts/io.github.wilkin.segmenta.json", "644"],
    ["../../packaging/native-messaging/microsoft-edge.json", "etc/opt/edge/native-messaging-hosts/io.github.wilkin.segmenta.json", "644"],
    ["../../packaging/native-messaging/brave.json", "etc/brave/native-messaging-hosts/io.github.wilkin.segmenta.json", "644"],
    ["../../packaging/native-messaging/vivaldi.json", "etc/vivaldi/native-messaging-hosts/io.github.wilkin.segmenta.json", "644"],
    ["../../packaging/native-messaging/opera.json", "etc/opera/native-messaging-hosts/io.github.wilkin.segmenta.json", "644"],
    ["../../packaging/native-messaging/firefox.json", "usr/lib/mozilla/native-messaging-hosts/io.github.wilkin.segmenta.json", "644"],
    ["../../packaging/segmenta.service", "usr/lib/systemd/user/", "644"],
    ["../../packaging/segmenta.socket", "usr/lib/systemd/user/", "644"],
    ["data/io.github.wilkin.Segmenta.desktop", "usr/share/applications/", "644"],
    ["data/io.github.wilkin.Segmenta.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/io.github.wilkin.Segmenta.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../dist/segmenta-extension-0.1.0.zip", "usr/share/segmenta/extensions/segmenta-chromium.zip", "644"],
    ["../../dist/segmenta-firefox-0.1.0.zip", "usr/share/segmenta/extensions/segmenta-firefox.zip", "644"],
    ["../../packaging/extensions/README", "usr/share/segmenta/extensions/", "644"],
]
