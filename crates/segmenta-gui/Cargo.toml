[package]
name = "segmenta-gui"
description = "Fast segmented download manager (daemon, CLI and GTK4 client)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage = "https://github.com/wilkin-barban/Segmenta"

[lib]
name = "segmenta_gui"
path = "src/lib.rs"

[[bin]]
name = "segmenta-gui"
path = "src/main.rs"

[dependencies]
glib = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
segmenta-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

# cargo-deb packaging of the GUI crate: the three binaries, the systemd user
# units, the desktop entry, the icon and the AppStream metadata ship in one
# `segmenta` package (S20). Sources live outside this crate, so they are
# addressed relative to this manifest.
[package.metadata.deb]
name = "segmenta"
section = "net"
priority = "optional"
maintainer = "Wilkin Barban Rosabal <barbanwilkin@gmail.com>"
copyright = "2026, Wilkin Barban Rosabal"
license-file = ["../../LICENSE", "0"]
extended-description = "Segmenta downloads HTTP and HTTPS files with several connections at once, writes every byte at its final offset and keeps the segment table in SQLite so a download survives a pause, a crash or a reboot. This package installs the download daemon (systemd user units), the segmenta CLI and the GTK4/Libadwaita desktop client."
# Runtime dependencies of the five shipped binaries, audited on Ubuntu 26.04 with
# `ldd target/release/segmenta*`, `dpkg -S` and `apt-cache depends`:
#
#   $auto     resolves the shared libraries the binaries really link against. On
#             26.04 that is libgtk-4-1 (>= 4.9.2), libadwaita-1-0 (>= 1.5~beta),
#             libc6, libglib2.0-0t64, libgraphene-1.0-0 and libssl3t64 (pulled by
#             librqbit -> openssl-sys).
#   libgtk-4-1 / libadwaita-1-0
#             kept explicit on top of $auto: cargo-deb only warns when a soname
#             cannot be mapped to a package, and losing the toolkit dependency
#             would install a GUI that cannot start. Both names still exist and
#             are installed on 26.04 (`apt-cache policy`), so they are not stale.
#   libsecret-tools
#             not a link-time dependency: the daemon spawns `secret-tool`
#             (crates/segmenta-daemon/src/secrets.rs). `libsecret-1-0` is NOT
#             declared because libsecret-tools already depends on it and no
#             shipped binary links it (no libsecret-1.so.0 in `ldd`).
#   ffmpeg
#             spawned binary (HLS/DASH remux and the final ffmpeg merge).
#   yt-dlp
#             spawned binary (YouTube). The archive one is older than the daemon's
#             MIN_YTDLP_VERSION, so the package also ships a current zipapp (below);
#             this dependency keeps a PATH copy for users who want one and is the
#             fallback the daemon uses when the embedded build is not newer.
#   python3
#             the embedded zipapp is `#!/usr/bin/env python3` + a zip: without an
#             interpreter it cannot run at all. Required by the upstream yt-dlp
#             release, and the reason `yt-dlp` in the archive dragged python3 in.
#   ca-certificates
#             owns the system trust store /etc/ssl/certs/ca-certificates.crt.
#             `strings target/release/segmenta-daemon` embeds the
#             rustls-native-certs/openssl-probe path list, because librqbit's HTTP
#             tracker client (reqwest 0.13) verifies TLS against the OS store: with
#             no bundle installed, https announce URLs fail verification. The
#             embedded Python yt-dlp reads the same store through `ssl`. The
#             HTTP/HTTPS engine itself ships Mozilla roots through webpki-roots and
#             does not need the bundle. Declared in Depends rather than Recommends
#             because an unverifiable tracker is a hard feature break, and the
#             package is Priority: important (330 KiB), so the install cost is nil.
#
# Everything else the binaries need is already pulled transitively; do not add
# packages "just in case", each one lengthens the install.
depends = "$auto, libgtk-4-1, libadwaita-1-0, libsecret-tools, ca-certificates, ffmpeg, yt-dlp, python3"
assets = [
    ["../../target/release/segmenta-gui", "usr/bin/", "755"],
    ["../../target/release/segmenta-cli", "usr/bin/", "755"],
    ["../../target/release/segmenta", "usr/bin/", "755"],
    ["../../target/release/segmenta-daemon", "usr/bin/", "755"],
    ["../../target/release/segmenta-host", "usr/bin/", "755"],
    ["../../packaging/native-messaging/google-chrome.json", "etc/opt/chrome/native-messaging-hosts/io.github.wilkin.segmenta.json", "644"],
    ["../../packaging/native-messaging/chromium.json", "etc/chromium/native-messaging-hosts/io.github.wilkin.segmenta.json", "644"],
    ["../../packaging/native-messaging/microsoft-edge.json", "etc/opt/edge/native-messaging-hosts/io.github.wilkin.segmenta.json", "644"],
    ["../../packaging/native-messaging/brave.json", "etc/brave/native-messaging-hosts/io.github.wilkin.segmenta.json", "644"],
    ["../../packaging/native-messaging/vivaldi.json", "etc/vivaldi/native-messaging-hosts/io.github.wilkin.segmenta.json", "644"],
    ["../../packaging/native-messaging/opera.json", "etc/opera/native-messaging-hosts/io.github.wilkin.segmenta.json", "644"],
    ["../../packaging/native-messaging/firefox.json", "usr/lib/mozilla/native-messaging-hosts/io.github.wilkin.segmenta.json", "644"],
    ["../../packaging/segmenta.service", "usr/lib/systemd/user/", "644"],
    ["../../packaging/segmenta.socket", "usr/lib/systemd/user/", "644"],
    ["data/io.github.wilkin.Segmenta.desktop", "usr/share/applications/", "644"],
    ["data/io.github.wilkin.Segmenta.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/io.github.wilkin.Segmenta.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../dist/segmenta-extension-0.2.1.zip", "usr/share/segmenta/extensions/segmenta-chromium.zip", "644"],
    ["../../dist/segmenta-firefox-0.2.1.zip", "usr/share/segmenta/extensions/segmenta-firefox.zip", "644"],
    ["../../packaging/extensions/README", "usr/share/segmenta/extensions/", "644"],
    ["../../packaging/segmenta-handler.desktop", "usr/share/applications/", "644"],
    # The upstream yt-dlp zipapp pinned in packaging/ytdlp.lock and materialised
    # by packaging/fetch-ytdlp.sh. It is not in git: the build fetches it and
    # verifies its SHA-256 before this asset can be packaged.
    ["../../dist/yt-dlp", "usr/share/segmenta/bin/yt-dlp", "755"],
]
