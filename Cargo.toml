[workspace]
resolver = "2"
members = [
    "crates/segmenta-core",
    "crates/segmenta-i18n",
    "crates/segmenta-daemon",
    "crates/segmenta-cli",
    "crates/segmenta-gui",
    "crates/segmenta-host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"
repository = "https://github.com/wilkin-barban/Segmenta"
authors = ["Wilkin Barban Rosabal <barbanwilkin@gmail.com>"]

[workspace.dependencies]
segmenta-i18n = { path = "crates/segmenta-i18n" }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
httpdate = "1.0"
libc = "0.2"
percent-encoding = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1.40", features = ["full"] }
uuid = { version = "1.10", features = ["v4"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
